name: shiftalarm
description: "專為輪班人士量身打造的極致隱私、純離線排班日曆與精確鬧鐘（Flutter / Android 原生整合 / Web PWA，支援 SA2/SR2 極簡二進制協議）"
publish_to: 'none'
version: 3.7.1+50

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  auto_size_text: ^3.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/ocean.frag
