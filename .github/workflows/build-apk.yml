name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Release Keystore
        run: |
          KEYSTORE_PATH="android/app/shiftalarm-release.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating permanent release keystore with keytool..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias shiftalarm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 18250 \
              -storepass shiftalarm2026 \
              -keypass shiftalarm2026 \
              -dname "CN=ShiftAlarm, OU=App, O=ShiftAlarm, L=HongKong, ST=HK, C=HK"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_PATH"
            git commit -m "ci: persist permanent release keystore shiftalarm-release.jks [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Permanent keystore already present: $KEYSTORE_PATH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftalarm-release-keystore-backup
          path: android/app/shiftalarm-release.jks

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        env:
          KEYSTORE_PASSWORD: shiftalarm2026
          KEY_ALIAS: shiftalarm
          KEY_PASSWORD: shiftalarm2026

      - name: Prepare APK Asset
        run: |
          TAG_OR_NAME="${{ github.ref_name }}"
          [ -z "$TAG_OR_NAME" ] && TAG_OR_NAME="latest"
          cp build/app/outputs/flutter-apk/app-release.apk "ShiftAlarm-${TAG_OR_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftAlarm-APK
          path: ShiftAlarm-*.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ShiftAlarm-*.apk
          name: ShiftAlarm ${{ github.ref_name }} - 極致隱私純離線排班鬧鐘
          generate_release_notes: true
          body: |
            ### ⏰ ShiftAlarm ${{ github.ref_name }} 版本發布

            專為輪班與排班人士量身打造的**極致隱私、純離線、全功能**排班日曆與精確鬧鐘應用程式。

            #### ✨ 本次版本更新亮點
            - 📐 **日曆頁改為固定三區**：頂部海洋線／中間日曆／底部排班詳情，位置與高度一次算定（`CalendarLayout`），**取消所有彈出彈入動畫**——點日期唔再彈板、唔使下划收起，排班詳情常駐喺底部。
            - 🎚️ **空間讓位有優先級**：屏幕唔夠高時，先縮海洋帶（96→56）、再縮底部區（158→142），**最後先縮日曆格**，確保班次永遠睇得清楚。
            - 🔁 **排班編輯原地切換**：㩒「排班」喺底部區原地換成編輯面板，高度完全不變；面板高度唔再寫死 126，改由底部區決定，三鍵導航機唔會再被裁掉完成掣。
            - 🧪 **佈局有永久防線**：新增 `CalendarLayout` 純函數 + 18 項單元測試（0→1400px 逐 1px 掃，保證三區總高永遠等於可用高度）與 3 項真 widget 冒煙測試（360×800／360×640 實泵，捉 RenderFlex 溢出）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
