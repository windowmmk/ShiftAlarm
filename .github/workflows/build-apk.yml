name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Release Keystore
        run: |
          KEYSTORE_PATH="android/app/shiftalarm-release.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating permanent release keystore with keytool..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias shiftalarm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 18250 \
              -storepass shiftalarm2026 \
              -keypass shiftalarm2026 \
              -dname "CN=ShiftAlarm, OU=App, O=ShiftAlarm, L=HongKong, ST=HK, C=HK"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_PATH"
            git commit -m "ci: persist permanent release keystore shiftalarm-release.jks [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Permanent keystore already present: $KEYSTORE_PATH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftalarm-release-keystore-backup
          path: android/app/shiftalarm-release.jks

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        env:
          KEYSTORE_PASSWORD: shiftalarm2026
          KEY_ALIAS: shiftalarm
          KEY_PASSWORD: shiftalarm2026

      - name: Prepare APK Asset
        run: |
          TAG_OR_NAME="${{ github.ref_name }}"
          [ -z "$TAG_OR_NAME" ] && TAG_OR_NAME="latest"
          cp build/app/outputs/flutter-apk/app-release.apk "ShiftAlarm-${TAG_OR_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftAlarm-APK
          path: ShiftAlarm-*.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ShiftAlarm-*.apk
          name: ShiftAlarm ${{ github.ref_name }} - 極致隱私純離線排班鬧鐘
          generate_release_notes: true
          body: |
            ### ⏰ ShiftAlarm ${{ github.ref_name }} 版本發布

            專為輪班與排班人士量身打造的**極致隱私、純離線、全功能**排班日曆與精確鬧鐘應用程式。

            #### ✨ 本次版本更新亮點

            **🎨 天色帶與日曆「成套」（一體化）**
            - **修好闊屏錯位**：天色帶同日曆區原本用**相反**嘅嵌套順序計闊度（一邊「先縮再夾」、一邊「先夾再縮」），
              算式喺闊度 > 480 時一定分叉 —— 實測 **900px 下天色帶 480、日曆 464，每邊錯開 8px**。
              手機 ≤480 兩式結果相同所以**完全睇唔出**，只有 Web PWA 開喺桌面瀏覽器會中。依家兩邊逐層對齊。
            - **日曆整區包成一張卡**：以前日曆係一堆散格直接浮喺頁面底色上，而天色帶係一張有圓角嘅卡，
              所以上下睇落係兩件嘢。依家共用**同一個底色、同一條描邊、同一個圓角、同一條內縮**，
              中間留 4px 呼吸位，睇得出係一套。
            - **格線更清楚**：日曆卡底色改用比頁面深一檔嘅霧藍灰，空白格疊上去嘅通道差由約 15/255 升到約 23/255。
            - **天色帶唔再「未載入時一片空白」**：着色器未就緒嗰幾百毫秒，以前底色同頁面**同色**（睇落係條空白），
              依家係一條有料嘅帶；靜默失敗退回 2D 版時邊緣亦只會透出協調色，唔會有一圈死白。

            - 🧪 **防線加厚**：新增 `test/band_card_alignment_test.dart`（8 項），
              用真 widget 喺 **320／360／412／900 四個寬度**量兩張卡嘅左右邊；
              闊屏嗰條用**具體數字 464** 鎖死（淨係「兩者相等」唔夠 —— 兩邊一齊錯都會通過），
              並用對比度斷言擋住「底色改淺／改純白令成個月曆變白板」。
              測試 **491 → 499 全綠**，`flutter analyze` 維持 **28 項零新增**。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
