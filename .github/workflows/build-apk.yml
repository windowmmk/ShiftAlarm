name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Asset
        run: |
          TAG_OR_NAME="${{ github.ref_name }}"
          [ -z "$TAG_OR_NAME" ] && TAG_OR_NAME="latest"
          cp build/app/outputs/flutter-apk/app-release.apk "ShiftAlarm-${TAG_OR_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftAlarm-APK
          path: ShiftAlarm-*.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ShiftAlarm-*.apk
          name: ShiftAlarm ${{ github.ref_name }} - 極致隱私純離線排班鬧鐘
          generate_release_notes: true
          body: |
            ### ⏰ ShiftAlarm ${{ github.ref_name }} 版本發布

            專為輪班與排班人士量身打造的**極致隱私、純離線、全功能**排班日曆與精確鬧鐘應用程式。

            #### ✨ 主要功能亮點
            - 🚀 **全新 SA2 / SR2 極簡二進制協議（Base58）**：
              - 配置口令 `SA2:<Base58>`（90 ~ 115 字元）
              - 排班口令 `SR2:<Base58>`（150 ~ 230 字元）
              - 內嵌 IEEE 802.3 CRC32 防偽防篡改校驗碼與時間戳
              - 雙模相容純 CSV 文字匯入（`YYYY-MM-DD,代號,場所`）
            - 🔗 **全場景零負擔分享體驗**：
              - 剪貼簿即時探針：打開彈窗自動辨識有效口令，免去手動貼上步驟
              - 網址 Hash 一鍵導入：支援 `#c=SA2:...` 與 `#r=SR2:...`，點開網址直接彈窗套用
              - 二維碼（QR Code）面對面掃碼快傳
            - 📅 **固定 6 週無縫月曆**：標準 42 格固定網格，消除跨月高度抖動；Web 端 60fps 流暢渲染。
            - 🔒 **100% 純離線與極致隱私**：無 INTERNET 網路權限，無帳號、無雲端、零追蹤。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
