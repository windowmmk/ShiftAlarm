name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Release Keystore
        run: |
          KEYSTORE_PATH="android/app/shiftalarm-release.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating permanent release keystore with keytool..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias shiftalarm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 18250 \
              -storepass shiftalarm2026 \
              -keypass shiftalarm2026 \
              -dname "CN=ShiftAlarm, OU=App, O=ShiftAlarm, L=HongKong, ST=HK, C=HK"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "ci: persist permanent release keystore shiftalarm-release.jks [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Permanent keystore already present: $KEYSTORE_PATH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftalarm-release-keystore-backup
          path: android/app/shiftalarm-release.jks

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        env:
          KEYSTORE_PASSWORD: shiftalarm2026
          KEY_ALIAS: shiftalarm
          KEY_PASSWORD: shiftalarm2026

      - name: Prepare APK Asset
        run: |
          TAG_OR_NAME="${{ github.ref_name }}"
          [ -z "$TAG_OR_NAME" ] && TAG_OR_NAME="latest"
          cp build/app/outputs/flutter-apk/app-release.apk "ShiftAlarm-${TAG_OR_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftAlarm-APK
          path: ShiftAlarm-*.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ShiftAlarm-*.apk
          name: ShiftAlarm ${{ github.ref_name }} - 極致隱私純離線排班鬧鐘
          generate_release_notes: true
          body: |
            ### ⏰ ShiftAlarm ${{ github.ref_name }} 版本發布

            專為輪班與排班人士量身打造的**極致隱私、純離線、全功能**排班日曆與精確鬧鐘應用程式。

            #### ✨ 本次版本更新亮點
            - 🔑 **永久固定 Release 簽名金鑰**：建立項目永久簽名指紋，往後所有版本支援無縫直接覆蓋安裝升級，永不丟失數據。
            - 🔔 **原生全屏鬧鐘瑞士幾何美學重構**：極簡雙耳時鐘矢量圖標、柔和呼吸光圈環、精密日期抬頭與自適應對稱膠囊按鈕。
            - 💬 **推播提醒文案人性化**：去除「延後360分鐘」等技術位移用語，收工打卡與開工提醒一目了然。
            - 🛡️ **儲存與導入強固化**：全面修復配置導入與 Base58 口令還原，完善單元測試覆蓋。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
