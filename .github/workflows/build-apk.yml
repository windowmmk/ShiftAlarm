name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Restore Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Configure signing secrets in Repository Settings."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/shiftalarm-release.jks

      - name: Build Release APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean Up Keystore File
        if: always()
        run: rm -f android/app/shiftalarm-release.jks

      - name: Prepare APK Asset
        run: |
          TAG_OR_NAME="${{ github.ref_name }}"
          [ -z "$TAG_OR_NAME" ] && TAG_OR_NAME="latest"
          cp build/app/outputs/flutter-apk/app-release.apk "ShiftAlarm-${TAG_OR_NAME}.apk"

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG_NAME"]
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              text = f.read()
          pattern = rf"^## {re.escape(tag)}\s*\n(.*?)(?=^## |\Z)"
          m = re.search(pattern, text, flags=re.M | re.S)
          notes = m.group(1).strip() if m else f"ShiftAlarm {tag} 版本發布。"
          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write(f"### ⏰ ShiftAlarm {tag} 版本發布\n\n{notes}\n")
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftAlarm-APK
          path: ShiftAlarm-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ShiftAlarm-*.apk
          name: ShiftAlarm ${{ github.ref_name }} - 極致隱私純離線排班鬧鐘
          body_path: release_notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
