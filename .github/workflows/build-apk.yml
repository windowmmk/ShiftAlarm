name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Release Keystore
        run: |
          KEYSTORE_PATH="android/app/shiftalarm-release.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating permanent release keystore with keytool..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias shiftalarm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 18250 \
              -storepass shiftalarm2026 \
              -keypass shiftalarm2026 \
              -dname "CN=ShiftAlarm, OU=App, O=ShiftAlarm, L=HongKong, ST=HK, C=HK"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_PATH"
            git commit -m "ci: persist permanent release keystore shiftalarm-release.jks [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "Permanent keystore already present: $KEYSTORE_PATH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftalarm-release-keystore-backup
          path: android/app/shiftalarm-release.jks

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        env:
          KEYSTORE_PASSWORD: shiftalarm2026
          KEY_ALIAS: shiftalarm
          KEY_PASSWORD: shiftalarm2026

      - name: Prepare APK Asset
        run: |
          TAG_OR_NAME="${{ github.ref_name }}"
          [ -z "$TAG_OR_NAME" ] && TAG_OR_NAME="latest"
          cp build/app/outputs/flutter-apk/app-release.apk "ShiftAlarm-${TAG_OR_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftAlarm-APK
          path: ShiftAlarm-*.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ShiftAlarm-*.apk
          name: ShiftAlarm ${{ github.ref_name }} - 極致隱私純離線排班鬧鐘
          generate_release_notes: true
          body: |
            ### ⏰ ShiftAlarm ${{ github.ref_name }} 版本發布

            專為輪班與排班人士量身打造的**極致隱私、純離線、全功能**排班日曆與精確鬧鐘應用程式。

            #### ✨ 本次版本更新亮點
            - ⏳ **響前 1 小時預告改為「狀態欄倒計時」**：唔再係一則靜態推送，而係一條**常駐、無聲、實時倒數**到響鬧時刻嘅狀態欄通知（`setChronometerCountDown`）。由 1 小時開始一直數到 0，唔會彈 heads-up 打擾你。
            - 🔕 **預告只限真鬧鐘**：開工／收工打卡呢類「只通知」項目**唔再**產生預告，狀態欄唔會再無端端多一條倒數。
            - ⏱️ **已進入預告窗口都照數**：就算你喺響前 30 分鐘先開 App、或者臨時排咗一個 30 分鐘後嘅更，倒計時都會即刻掛上去，唔會漏。
            - 📏 **底部排班詳情「用盡」高度**：修正用死 72px 預留導航欄嘅錯誤——手勢導航實高 88.8、三鍵導航 112.8，舊版會令詳情卡被導航欄蓋住 10–40px，鍵盤彈起時又反過來空出 72–78px 空白。改用 `MediaQuery.padding.bottom` 實測值後**空白歸零**。
            - ⌨️ **打字時天色欄自動收成 0**：新增／編輯備註、場名嗰陣，頂部海洋帶即刻讓位，日曆格高由 19px 回到 40px，唔會再有「打字畫面被切一半」嘅感覺。
            - 🧪 **防線加厚**：測試由 187 增至 254 項，新增 19 項預告單元測試（原本零覆蓋）與 30 項佈局實測斷言（逐場景驗證底部空白 ≤7px、面板零溢出）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
