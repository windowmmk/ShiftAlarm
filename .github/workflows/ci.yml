name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  build-checks:
    name: Build Checks (Web & Android)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --base-href "/ShiftAlarm/"

      - name: Build Android APK (Debug Verify)
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Install CJK Fonts for Screenshot Verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Render UI Screenshots
        run: |
          flutter test tool/gen_screenshots_test.dart --plain-name home
          flutter test tool/gen_screenshots_test.dart --plain-name stats
          flutter test tool/gen_screenshots_test.dart --plain-name shifts
          flutter test tool/gen_screenshots_test.dart --plain-name settings

      - name: Upload UI Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/screenshots/*.png
